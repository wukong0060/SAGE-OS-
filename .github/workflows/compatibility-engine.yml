name: SAGE Compatibility Engine 2.1

on:
  push:
    branches: [ main, feature/compatibility-engine-2.0 ]
    paths:
      - 'Compatibility/**'
      - 'Security/**'
      - 'Tests/**'
      - '.github/workflows/compatibility-engine.yml'
  pull_request:
    paths:
      - 'Compatibility/**'
      - 'Security/**'
      - 'Tests/**'
      - '.github/workflows/compatibility-engine.yml'
  workflow_dispatch:

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse SAGE PowerShell sources
        shell: powershell
        run: |
          $files = @(
            '.\Compatibility\Get-SAGECompatibility.ps1',
            '.\Compatibility\Get-SAGEDependencyReport.ps1',
            '.\Security\Get-SAGESecurityPosture.ps1',
            '.\Tests\CompatibilityEngine.Tests.ps1',
            '.\Tests\DependencySecurity.Tests.ps1'
          )
          foreach ($file in $files) {
            $null = [scriptblock]::Create((Get-Content -LiteralPath $file -Raw))
          }
      - name: Run compatibility tests
        shell: powershell
        run: .\Tests\CompatibilityEngine.Tests.ps1
      - name: Run dependency and security tests
        shell: powershell
        run: .\Tests\DependencySecurity.Tests.ps1

  pwsh-7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell 7 is available
        shell: pwsh
        run: |
          Write-Host "PowerShell runtime: $($PSVersionTable.PSVersion)"
      - name: Parse SAGE PowerShell sources
        shell: pwsh
        run: |
          $files = @(
            '.\Compatibility\Get-SAGECompatibility.ps1',
            '.\Compatibility\Get-SAGEDependencyReport.ps1',
            '.\Security\Get-SAGESecurityPosture.ps1',
            '.\Tests\CompatibilityEngine.Tests.ps1',
            '.\Tests\DependencySecurity.Tests.ps1'
          )
          foreach ($file in $files) {
            $null = [scriptblock]::Create((Get-Content -LiteralPath $file -Raw))
          }
      - name: Run compatibility tests
        shell: pwsh
        run: .\Tests\CompatibilityEngine.Tests.ps1
      - name: Run dependency and security tests
        shell: pwsh
        run: .\Tests\DependencySecurity.Tests.ps1
